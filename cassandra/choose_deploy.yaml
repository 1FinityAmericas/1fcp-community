---
- hosts: localhost
  any_errors_fatal: true
  gather_facts: false

  tasks:
    - debug:
        msg:
          - Please execute the deployment script with one of the following options:
          -   -t push-images                : Manage rancher-local-provisioner images (identify, load, and push to registry) 
          -   -t deploy-cassandra     :  Deploy cassandra helm chart
          -   -t cleanup-cassandra    :  Uninstall cassandra helm chart and pvc
      tags: help
      run_once: true

- import_playbook: app_config.yaml
  tags: [never, push-images, deploy-cassandra, cleanup-cassandra]

- import_playbook: push_images.yaml
  tags: [never, push-images, deploy-cassandra]

- import_playbook: deploy_cassandra.yaml
  tags: [never, deploy-cassandra]

- import_playbook: cleanup_cassandra.yaml
  tags: [never, cleanup-cassandra]

