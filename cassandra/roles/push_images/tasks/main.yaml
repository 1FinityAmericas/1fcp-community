---
- name: Identify missing images
  import_tasks: identify_images.yaml

- name: Load missing images
  include_tasks: load_images.yaml
  when: missing_images | length > 0 or push_all_images | default(false) 

- name: Push missing images
  include_tasks: push_images.yaml
  when: missing_images | length > 0 or push_all_images | default(false) 
