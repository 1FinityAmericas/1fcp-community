Repo_Manager:
  - randheer.singh@fujitsu.com
Team: docker-local-registry
Workflow_Mapping:
  BranchEvent:
    - Branch: "^(master$|dev/fcp1.0$)"
      Image: artifactory.fnc.fujitsu.com/docker-hosted/argocd-client:fcp1.0
      Workflow:
        - Stage: "Sync_ArgoCD"
          OnError: "Abort"
        - Stage: "Upload_Tarball"
          OnError: "Abort"
        - Stage: "Sonar_Analysis"
          OnError: "Continue"
        - Stage: "Deploy_Apps"
          OnError: "Abort"
        - Step: "Pytest"
          On_Failure: "Ignore"
        - Stage: "Cleanup"
          OnError: "Abort"
    - Branch: "^(feature.*|bugfix/.*|hotfix/.*)"
      Image: artifactory.fnc.fujitsu.com/docker-hosted/java17_base_image:v1
      Workflow: []
  PREvent:
    - Source_Branch: "^(feature.*|bugfix/.*|hotfix/.*|fcp.*)"
      Target_Branch: "^(master$|dev/fcp1.0$)"
      Image: artifactory.fnc.fujitsu.com/docker-hosted/dind-kind:1.1.0
      Docker_Args: |
        -u root --privileged
        --cgroupns=host
        -v "/sys/fs/cgroup:/sys/fs/cgroup:rw"
      Workflow:
        - Step: "BringupWorkspace"
          Custom_pip: "true"
          On_Failure: "Abort"
        - Step: "Create_Kind_Cluster"
          Topology:
            master: 1
            worker: 3
          On_Failure: "Abort"
        - Stage: "Sonar_Analysis"
          OnError: "Continue"
        - Step: "Molecule_Test"
          On_Failure: "Continue"
        - Step: "Deploy_Apps"
          On_Failure: "Abort"
        - Step: "Pytest"
          On_Failure: "Continue"
        - Step: "Cleanup"
          On_Failure: "Abort"
    - Source_Branch: "^(feature/.*|bugfix/.*|hotfix/.*)"
      Target_Branch: "^(hotfix-.*)"
      Image: artifactory.fnc.fujitsu.com/docker-hosted/java17_base_image:v1
      Workflow: []
