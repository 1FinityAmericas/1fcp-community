---
#
- name: Replacing the localPV path dynamically
  blockinfile:
    path: '{{ playbook_dir }}/apps/helm-charts/values.yaml'
    marker: "# {mark} ANSIBLE MANAGED BLOCK"
    block: |
      nodePathMap:
      {% for item in rancher_local_pv.nodePathMap %}
        - node: {{ item.node }}
          paths:
      {% for path in item.paths %}
            - {{ path }}
      {% endfor %}
      {% endfor %}
              
- name: create rancher local storage namespace
  shell: kubectl create ns "{{ rancher_local_pv.namespace }}"
  ignore_errors: yes

- name: deploy rancher-local-provisioner
  shell: "helm upgrade --install {{ rancher_local_pv.name }} {{ playbook_dir }}/apps/helm-charts/. -n {{ rancher_local_pv.namespace }} \
          --set storageClass.name={{ rancher_local_pv.class }} \
          --set privateRegistry.registryUrl={{ registry }} \
          --set image.repository={{ rancher_local_pv.image.repository }} \
          --set image.tag={{ rancher_local_pv.image.tag }} \
          --set image.pullPolicy={{ rancher_local_pv.image.pullPolicy }} \
          --set helperImage.repository={{ rancher_local_pv.helper.image.repository }} \
          --set helperImage.tag={{ rancher_local_pv.helper.image.tag }} \
          --set helperImage.pullPolicy={{ rancher_local_pv.helper.image.pullPolicy }} \
          --set rbac.create={{ rancher_local_pv.rbac.enabled }} \
          --set resources.requests.cpu={{ rancher_local_pv.rancher_resources.requests.cpu }} \
          --set resources.requests.memory={{ rancher_local_pv.rancher_resources.requests.memory }} \
          --set resources.limits.cpu={{ rancher_local_pv.rancher_resources.limits.cpu }} \
          --set resources.limits.memory={{ rancher_local_pv.rancher_resources.limits.memory }} \
          --set helperPod.resources.requests.cpu={{ rancher_local_pv.helper_resources.requests.cpu }} \
          --set helperPod.resources.requests.memory={{ rancher_local_pv.helper_resources.requests.memory }} \
          --set helperPod.resources.limits.cpu={{ rancher_local_pv.helper_resources.limits.cpu }} \
          --set helperPod.resources.limits.memory={{ rancher_local_pv.helper_resources.limits.memory }}"

- name: Wait for Rancher local pv  pods to be Running and Ready
  shell: "kubectl get pods -n {{ rancher_local_pv.namespace }} -l app.kubernetes.io/instance={{ rancher_local_pv.name }} --no-headers | awk '{ print $2, $3}'"
  register: pod_status_cmd
  until: >
    (pod_status_cmd.stdout_lines | length == 0) or
    (
      pod_status_cmd.stdout_lines
        | select('match', '^([0-9]+)/\\1 Running$')
        | list
        | length == (pod_status_cmd.stdout_lines | length)
    )
  retries: 20
  delay: 10
  changed_when: false


- name: Set {{ rancher_local_pv.class }} as default StorageClass
  shell: |
    kubectl patch storageclass {{ rancher_local_pv.class }} \
      -p '{"metadata": {"annotations":{"storageclass.kubernetes.io/is-default-class":"true"}}}'
