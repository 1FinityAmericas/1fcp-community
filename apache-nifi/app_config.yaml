---
- name: Get primary and secondary hostnames
  hosts: localhost
  gather_facts: yes
  tasks:

    # ── ON-PREM ONLY ────────────────────────────────────────
    - block:
        - name: Collect matching hostname details for on-prem-RKE2
          set_fact:
            primary_nodes: >-
              {{
                groups['kubenodes'] | map('extract', hostvars) | selectattr('ip', 'in', ansible_all_ipv4_addresses) | list
              }}

        - name: Add primary host to primary_node_group for on-prem-RKE2
          add_host:
            name: "{{ item.inventory_hostname }}"
            groups: primary_master_node_group
          loop: "{{ primary_nodes }}"

        - name: Collect remaining master nodes (excluding localhost) for on-prem-RKE2
          set_fact:
            secondary_master_nodes: >-
              {{
                groups['kubenodes']
                | map('extract', hostvars)
                | selectattr('group', 'equalto', 'node-config-master')
                | rejectattr('ip', 'in', ansible_all_ipv4_addresses)
                | list
              }}

        - name: Add secondary masters to secondary_master_node_group on-prem-RKE2
          add_host:
            name: "{{ item.inventory_hostname }}"
            groups: secondary_master_node_group
          loop: "{{ secondary_master_nodes }}"

      when:
        - "k8s_provider == 'rke2'"

    # ── AKS ONLY — single add_host for both groups ──────────
    - name: Assign bastion-node to primary and secondary groups for (AKS)
      add_host:
        name: "bastion-node"
        groups:
          - primary_master_node_group
          - secondary_master_node_group
      when:
        - "k8s_provider in ['aks', 'eks', 'gke']"

- hosts: primary_master_node_group
  roles:
    - app_config

