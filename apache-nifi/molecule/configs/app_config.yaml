---
##-----------------apache-nifi---------------------
apache_nifi:
  app_name: apache_nifi
  path: apache-nifi
  image:
    repository: nifi
    tag: 2.7.2
    enabled: true
  replicaCount: 3
  namespace: nifi
  ingress:
    enabled: true  
  auth:
    mode: singleUser
    username: admin
    password: 0NifiAdmin@123 # Atleast 12 character long.
  resources:
    requests:
      memory: "2Gi"
      cpu: 2
    limits:
      memory: "4Gi"
      cpu: 4
  jvm:
    xms: 1g
    xmx: 2g
    extra: ""        
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault   
  persistence:
    enabled: true
    accessModes:
      - ReadWriteOnce
    size: 10Gi
    storageClassName: "rancher-dynamic-local-path" 
  repositories:
    content:
      enabled: false
      size: 10Gi
    flowfile:
      enabled: false
      size: 10Gi
    provenance:
      enabled: false
      size: 10Gi
    database:
      enabled: false
      size: 5Gi
  customConf:
    enabled: false
    storageSize: "100Mi"
    hostPath: /var/lib/docker/dynamic-local-path-mounts/nifi/conf
  customLib:
    enabled: false
    storageSize: "5Gi"
    hostPath: /var/lib/docker/dynamic-local-path-mounts/nifi/lib
  customExtensions:
    enabled: false
    storageSize: "5Gi"
    hostPath: /var/lib/docker/dynamic-local-path-mounts/nifi/extensions
  dpmScripts:
    enabled: false
    storageSize: "1Gi"
    hostPath: /var/lib/docker/dynamic-local-path-mounts/nifi/dpm-scripts

external_registry:
  username: automation
  password: automation  
