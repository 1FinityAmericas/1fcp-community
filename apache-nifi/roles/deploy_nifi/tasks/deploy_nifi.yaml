---
#
- name: Create NiFi namespace if not exists
  shell: |
    set -e
    kubectl get namespace "{{ apache_nifi.namespace }}" >/dev/null 2>&1 \
    || kubectl create namespace "{{ apache_nifi.namespace }}"

# ==============================================================================
# Ingress Controller Validation
# ==============================================================================
- name: Get deployed ingress controller from IngressClass
  shell: kubectl get ingressclass --no-headers | awk '{print $1}'
  register: deployed_controller
  changed_when: false

- name: Fail if no IngressClass exists in cluster
  fail:
    msg: "No IngressClass available in the cluster. Deployment cannot continue."
  when: deployed_controller.stdout | trim | length == 0

- name: Check if configured ingress controller exists
  shell: kubectl get ingressclass {{ apache_nifi.ingress_controller.name }}
  register: controller_check
  failed_when: false
  changed_when: false

- name: Fail if configured ingress controller does not exist
  fail:
    msg: >-
      Configured ingress controller '{{ apache_nifi.ingress_controller.name }}' not found.
      Available IngressClass: {{ deployed_controller.stdout | trim }}.
      Please update ingress_controller in app_config.yaml.
  when: controller_check.rc != 0

# ==============================================================================
# Shared Gateway Validation (for Traefik)
# ==============================================================================
- name: Check if Shared Gateway exists for traefik
  shell: kubectl get gateway {{ apache_nifi.shared_gateway.name }} -n {{ apache_nifi.shared_gateway.namespace }}
  register: gateway_check
  failed_when: false
  changed_when: false
  when: apache_nifi.ingress_controller.name == 'traefik'

- name: Fail if Gateway does not exist for traefik controller
  fail:
    msg: >-
      Gateway '{{ apache_nifi.shared_gateway.name }}' not found in namespace '{{ apache_nifi.shared_gateway.namespace }}'.
      Please ensure the Gateway is deployed before installing apache-nifi with traefik controller.
  when:
    - apache_nifi.ingress_controller.name == 'traefik'
    - gateway_check.rc != 0



- name: Copy start.sh to apache-nifi helm charts location
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/roles/deploy_nifi/files/start.sh"
    dest: "{{ playbook_dir }}/apps/helm-charts/files/start.sh"
    mode: '0755'
 
- name: Override NiFi start.sh replica loop using replicaCount
  become: yes
  shell:  sed -i "s/\$(seq 0 replicaCount)/\$(seq 0 {{ apache_nifi.replicaCount -1 }} )/"  {{ playbook_dir }}/apps/helm-charts/files/start.sh

- name: Get list of StorageClasses
  shell: kubectl get storageclass --no-headers
  register: sc_list
  changed_when: false

- name: Fail if no StorageClass exists in cluster
  fail:
    msg: "No StorageClass available in the cluster. Apache nifi deployment cannot continue."
  when: sc_list.stdout | trim | length == 0

- name: Check if configured StorageClass exists
  shell: >
    kubectl get storageclass {{ apache_nifi.persistence.storageClassName }}
    --ignore-not-found
    -o name
  register: sc_check
  changed_when: false

- name: Get default StorageClass if configured one does not exist
  shell: >
    kubectl get storageclass
    -o jsonpath='{.items[?(@.metadata.annotations.storageclass\.kubernetes\.io/is-default-class=="true")].metadata.name}'
  register: default_sc
  changed_when: false
  when: sc_check.stdout | trim == ""

- name: Fail if neither configured nor default StorageClass exists
  fail:
    msg: >-
      Configured StorageClass '{{ apache_nifi.persistence.storageClassName }}'
      does not exist and no default StorageClass is defined in the cluster.
      Helm deployment aborted.
  when:
    - sc_check.stdout | trim == ""
    - default_sc.stdout | trim == ""

- name: Resolve StorageClass to use
  set_fact:
    resolved_storage_class: >-
      {{
        apache_nifi.persistence.storageClassName
        if sc_check.stdout | trim != ""
        else default_sc.stdout | trim
      }}

- name: Show resolved StorageClass
  debug:
    msg: "Using StorageClass: {{ resolved_storage_class }}"

- name: Ensure NiFi custom conf directory exists
  become: yes
  ansible.builtin.file:
    path: /var/lib/docker/dynamic-local-path-mounts/nifi/conf
    state: directory
    mode: '0755'
  delegate_to: "{{ item }}"
  loop: "{{ groups['kubenodes'] }}"
  when:
    - apache_nifi.customConf.enabled | bool  

- name: Check if custom-conf directory exists on all worker nodes
  stat:
    path: /var/lib/docker/dynamic-local-path-mounts/nifi/conf
  register: custom_conf_dir
  delegate_to: "{{ item }}"
  loop: "{{ groups['kubenodes'] }}"
  when: 
    - apache_nifi.customConf.enabled | bool

- name: Fail if custom-conf directory does not exist on any worker node
  fail:
    msg: "customConf is enabled but directory /var/lib/docker/dynamic-local-path-mounts/nifi/conf does not exist on {{ item.item }}. Please create it and copy your custom configuration files."
  when:
    - apache_nifi.customConf.enabled | bool
    - not item.stat.exists
  loop: "{{ custom_conf_dir.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Copy NiFi conf tarballs
  become: yes
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/apps/custom_pkg/conf/"
    dest: "/var/lib/docker/dynamic-local-path-mounts/nifi/conf/"
  delegate_to: "{{ item }}"
  loop: "{{ groups['kubenodes'] }}"
  when:
    - apache_nifi.customConf.enabled | bool

- name: Find NiFi conf tarballs
  become: yes
  ansible.builtin.find:
    paths: "/var/lib/docker/dynamic-local-path-mounts/nifi/conf/"
    patterns:
      - "*.tar"
      - "*.tar.gz"
  register: conf_tarballs
  delegate_to: "{{ item }}"
  loop: "{{ groups['kubenodes'] }}"
  when:
    - apache_nifi.customConf.enabled | bool

- name: Extract NiFi conf tarballs
  become: yes
  ansible.builtin.unarchive:
    src: "{{ item.1.path }}"
    dest: /var/lib/docker/dynamic-local-path-mounts/nifi/conf/
    remote_src: yes
  delegate_to: "{{ item.0.item }}"
  loop: "{{ conf_tarballs.results | selectattr('matched', 'gt', 0) | subelements('files') }}"
  loop_control:
    label: "{{ item.1.path }}"
  when:
    - apache_nifi.customConf.enabled | bool
      
- name: Remove NiFi conf tarballs after extraction
  become: yes
  ansible.builtin.file:
    path: "{{ item.1.path }}"
    state: absent
  delegate_to: "{{ item.0.item }}"
  loop: "{{ conf_tarballs.results | selectattr('matched', 'gt', 0) | subelements('files') }}"
  loop_control:
    label: "{{ item.1.path }}"
  when:
    - apache_nifi.customConf.enabled | bool

