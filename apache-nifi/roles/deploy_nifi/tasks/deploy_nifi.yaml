- name: deploy nifi application
  shell: |
    helm upgrade --install nifi --namespace "{{ apache_nifi.namespace }}" \
      -f "{{ playbook_dir }}/apps/helm-charts/values.yaml" "{{ playbook_dir }}/apps/helm-charts/" \
      --set auth.mode="{{ apache_nifi.auth.mode }}" \
      --set replicaCount="{{ apache_nifi.replicaCount }}" \
      --set auth.username="{{ apache_nifi.auth.username }}" \
      --set auth.password="{{ apache_nifi.auth.password }}" \
      --set image.registry="{{ registry }}" \
      --set image.repository="{{ apache_nifi.image.repository }}" \
      --set image.tag="{{ apache_nifi.image.tag }}" \
      --set resources.requests.cpu="{{ apache_nifi.resources.requests.cpu }}" \
      --set resources.requests.memory="{{ apache_nifi.resources.requests.memory }}" \
      --set resources.limits.cpu="{{ apache_nifi.resources.limits.cpu }}" \
      --set resources.limits.memory="{{ apache_nifi.resources.limits.memory }}" \
      --set jvm.xms="{{ apache_nifi.jvm.xms }}" \
      --set jvm.xmx="{{ apache_nifi.jvm.xmx }}" \
      --set jvm.extra="{{ apache_nifi.jvm.extra }}" \
      --set ingressController.name={{ apache_nifi.ingress_controller.name }} \
      --set ingress.enabled={{ apache_nifi.ingress.enabled }} \
      --set ingress.ip="{{ ingress_host }}" \
      {% if apache_nifi.ingress_controller.name == 'nginx' %}
      --set ingress.hosts[0].host="{{ ingress_host }}" \
      --set ingress.tls[0].hosts[0]="{{ ingress_host }}" \
      {% endif %}
      {% if apache_nifi.ingress_controller.name == 'traefik' %}
      --set shared_gateway.name={{ apache_nifi.shared_gateway.name }} \
      --set shared_gateway.namespace={{ apache_nifi.shared_gateway.namespace }} \
      --set shared_gateway.hostname="{{ ingress_host }}" \
      --set ingressController.localCert={{ apache_nifi.ingress_controller.localCert }} \
      {% endif %}
      --set customConf.enabled={{ apache_nifi.customConf.enabled }} \
      --set customConf.storageSize={{ apache_nifi.customConf.storageSize }} \
      --set customConf.hostPath={{ apache_nifi.customConf.hostPath }} \
      --set customLib.enabled={{ apache_nifi.customLib.enabled }} \
      --set customLib.storageSize={{ apache_nifi.customLib.storageSize }} \
      --set customLib.hostPath={{ apache_nifi.customLib.hostPath }} \
      --set customExtensions.enabled={{ apache_nifi.customExtensions.enabled }} \
      --set customExtensions.storageSize={{ apache_nifi.customExtensions.storageSize }} \
      --set customExtensions.hostPath={{ apache_nifi.customExtensions.hostPath }} \
      --set dpmScripts.enabled={{ apache_nifi.dpmScripts.enabled }} \
      --set dpmScripts.storageSize={{ apache_nifi.dpmScripts.storageSize }} \
      --set dpmScripts.hostPath={{ apache_nifi.dpmScripts.hostPath }} \
      --set securityContext.runAsUser="{{ apache_nifi.securityContext.runAsUser }}" \
      --set securityContext.runAsGroup="{{ apache_nifi.securityContext.runAsGroup }}" \
      --set securityContext.fsGroup="{{ apache_nifi.securityContext.runAsGroup }}" \
      --set nifiWebProxyHost="{{ ingress_host }}" \
      --set persistence.enabled="{{ apache_nifi.persistence.enabled }}" \
      --set persistence.size="{{ apache_nifi.persistence.size }}" \
      --set persistence.storageClassName="{{ resolved_storage_class }}" \
      --set securityContext.seccompProfile.type="{{ apache_nifi.securityContext.seccompProfile.type }}" \
      --set properties.cluster.nodeReadTimeout="{{ apache_nifi.properties.cluster.nodeReadTimeout }}" \
      --set properties.cluster.nodeConnectionTimeout="{{ apache_nifi.properties.cluster.nodeConnectionTimeout }}" \
      --set properties.cluster.requestReplicationClaimTimeout="{{ apache_nifi.properties.cluster.requestReplicationClaimTimeout }}" \
      --set properties.cluster.isNode="{{ apache_nifi.properties.cluster.isNode }}"


- name: Wait for all NiFi pods to be Ready
  shell: >
    kubectl get pods
    -n {{ apache_nifi.namespace }}
    -l app.kubernetes.io/instance=nifi
    --no-headers
  register: nifi_pods
  until:
    - nifi_pods.stdout_lines | length == apache_nifi.replicaCount | int
    - (nifi_pods.stdout | regex_findall('1/1') | length) == apache_nifi.replicaCount | int
    - (nifi_pods.stdout | regex_findall('Running') | length) == apache_nifi.replicaCount | int
  retries: 60        # 10 minutes
  delay: 10


# ==============================================================================
# Local Gateway Validation (for Traefik)
# ==============================================================================
- name: Check if local gateway exists for traefik
  shell: kubectl get gateway nifi-gateway -n {{ apache_nifi.namespace }}
  register: local_gateway_check
  failed_when: false
  changed_when: false
  when:
    - apache_nifi.ingress_controller.name == 'traefik'
    - apache_nifi.ingress_controller.localCert | bool

- name: Fail if Local gateway does not exist for traefik controller
  fail:
    msg: >-
      Gateway 'nifi-gateway' not found in namespace '{{ apache_nifi.namespace }}'.
      Please ensure the Gateway is deployed along with apache-nifi.
  when:
    - apache_nifi.ingress_controller.name == 'traefik'
    - apache_nifi.ingress_controller.localCert | bool
    - local_gateway_check.rc != 0


- debug:
    msg: "nifi_pods -> {{ nifi_pods }}"




