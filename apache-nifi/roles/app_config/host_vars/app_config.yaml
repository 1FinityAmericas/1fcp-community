---
##-----------------apache-nifi---------------------
apache_nifi:
  app_name: apache_nifi
  path: apache-nifi
  image:
    repository: nifi
    tag: 2.9.0-debian13
    enabled: true
  replicaCount: 3
  namespace: nifi
  ingress:
    enabled: true  
  auth:
    mode: singleUser
    username: admin
    password: 0NifiAdmin@123 # Atleast 12 character long.
  resources:
    requests:
      memory: "2Gi"
      cpu: 2
    limits:
      memory: "4Gi"
      cpu: 4
  jvm:
    xms: 1g
    xmx: 2g
    extra: ""        
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault   
  persistence:
    enabled: true
    accessModes:
      - ReadWriteOnce
    size: 10Gi
    storageClassName: "rancher-dynamic-local-path" 
  customConf:
    enabled: false
    storageSize: "100Mi"
    hostPath: /var/lib/docker/dynamic-local-path-mounts/nifi/conf
  customLib:
    enabled: false
    storageSize: "5Gi"
    hostPath: /var/lib/docker/dynamic-local-path-mounts/nifi/lib
  customExtensions:
    enabled: false
    storageSize: "5Gi"
    hostPath: /var/lib/docker/dynamic-local-path-mounts/nifi/extensions
  dpmScripts:
    enabled: false
    storageSize: "1Gi"
    hostPath: /var/lib/docker/dynamic-local-path-mounts/nifi/dpm-scripts
  properties:
    cluster:
      isNode: true
      nodeReadTimeout: "5 min"
      nodeConnectionTimeout: "30 sec"
      requestReplicationClaimTimeout: "5 min"

  # Ingress Controller Configuration
  # Options: 'nginx' or 'traefik'
  ingress_controller:
    name: nginx
    localCert: true # Set false if want shared gateway

  # Gateway API Configuration (used when ingress_controller.name is 'traefik')
  shared_gateway:
    name: traefik-gateway # Shared gateway name
    namespace: kube-system # shared gateway namespace

external_registry:
  username: automation
  password: automation     


