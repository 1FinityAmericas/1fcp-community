- name: Resolve images to push
  set_fact:
    images_to_push: "{{ missing_images if push_all_images | default(false) == false else all_app_images }}"

- name: Images to push
  debug:
    var: images_to_push

- name: Push images to registry
  become: yes
  shell: podman push {{ registry }}/{{ item.repo }}:{{ item.tag }}
  loop: "{{ images_to_push }}"
  register: push_result
  retries: 3
  delay: 10
  until: push_result.rc == 0

- name: Get image ID for image
  become: yes
  shell: podman images -q {{ registry }}/{{ item.repo }}:{{ item.tag }}
  register: image_ids
  loop: "{{ images_to_push }}"
  changed_when: false

- name: Remove images from local Podman storage by ID (removes all tags)
  become: yes
  shell: podman rmi -f {{ item.stdout }}
  loop: "{{ image_ids.results }}"
  when: item.stdout is defined and item.stdout | length > 0
  failed_when: false
