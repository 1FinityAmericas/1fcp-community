apiVersion: v1
kind: Service
metadata:
  name: {{ include "nifi.fullname" . }}-headless
  labels:
    app.kubernetes.io/name: {{ .Chart.Name | replace "." "-" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: https
      port: 8443
      targetPort: 8443
      protocol: TCP
    - name: cluster
      port: 11443
      targetPort: 11443
      protocol: TCP
    - name: s2s
      port: 10000
      targetPort: 10000
      protocol: TCP
    - name: load-balance
      port: 6342
      targetPort: 6342
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ .Chart.Name | replace "." "-" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
