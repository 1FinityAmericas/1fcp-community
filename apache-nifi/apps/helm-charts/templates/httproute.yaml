{{- if (eq .Values.ingressController.name "traefik") }}
{{- $fullName := include "nifi.fullname" . -}}
{{- $hostname := .Values.shared_gateway.hostname | default .Values.ingress.ip -}}
---
# ==============================================================================
# HTTPRoute - HTTPS with middleware and sticky sessions
# ==============================================================================
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}-https
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name | replace "." "-" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  parentRefs:
    {{- if .Values.ingressController.localCert }}
    # Use NiFi's dedicated gateway with its own TLS certificate (apache-nifi-secret)
    - name: {{ $fullName }}-gateway
      namespace: {{ .Release.Namespace }}
      sectionName: {{ $fullName }}-https
    {{- else }}
    # Use shared Traefik gateway with default TLS certificate
    - name: {{ .Values.shared_gateway.name }}
      namespace: {{ .Values.shared_gateway.namespace }}
      sectionName: {{ .Values.shared_gateway.httpsSectionName }}
    {{- end }}
  hostnames:
    - {{ $hostname }}
  rules:
    - matches:
        - path:
            type: {{ .Values.shared_gateway.pathMatch.type }}
            value: {{ .Values.shared_gateway.pathMatch.value }}
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: {{ $fullName }}-buffering
      backendRefs:
        - group: traefik.io
          kind: TraefikService
          name: {{ $fullName }}-sticky
      timeouts:
        backendRequest: {{ .Values.shared_gateway.timeouts.backendRequest }}
        request: {{ .Values.shared_gateway.timeouts.request }}
{{- end }}

