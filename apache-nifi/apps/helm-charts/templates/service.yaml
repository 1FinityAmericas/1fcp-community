apiVersion: v1
kind: Service
metadata:
  name: {{ include "nifi.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name | replace "." "-" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: https
  selector:
    app.kubernetes.io/name: {{ .Chart.Name | replace "." "-" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
