{{- if eq .Values.ingressController.name "traefik" }}
{{- $fullName := include "nifi.fullname" . -}}
{{- $hostname := .Values.shared_gateway.hostname | default .Values.ingress.ip -}}
---
# ==============================================================================
# ServersTransport - Skip internal TLS verification for NiFi backend
# ==============================================================================
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: {{ $fullName }}-transport
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name | replace "." "-" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  insecureSkipVerify: {{ .Values.shared_gateway.serversTransport.insecureSkipVerify }}
---
# ==============================================================================
# Middleware - Buffering for large NiFi requests
# ==============================================================================
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $fullName }}-buffering
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name | replace "." "-" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  buffering:
    maxRequestBodyBytes: {{ .Values.shared_gateway.middleware.buffering.maxRequestBodyBytes }}
    memRequestBodyBytes: {{ .Values.shared_gateway.middleware.buffering.memRequestBodyBytes }}
    retryExpression: {{ .Values.shared_gateway.middleware.buffering.retryExpression | quote }}
---
# ==============================================================================
# TraefikService - Sticky sessions with backend TLS
# ==============================================================================
apiVersion: traefik.io/v1alpha1
kind: TraefikService
metadata:
  name: {{ $fullName }}-sticky
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name | replace "." "-" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  weighted:
    services:
      - kind: Service
        name: {{ $fullName }}
        port: {{ .Values.service.port }}
        scheme: https
        serversTransport: {{ $fullName }}-transport
        sticky:
          cookie:
            name: {{ .Values.shared_gateway.sticky.cookieName }}
            secure: {{ .Values.shared_gateway.sticky.secure }}
            httpOnly: {{ .Values.shared_gateway.sticky.httpOnly }}
            sameSite: {{ .Values.shared_gateway.sticky.sameSite }}
{{- end }}
