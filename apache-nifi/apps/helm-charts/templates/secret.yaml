{{- if .Values.ingress.enabled -}}
{{- $ip := .Values.ingress.ip -}}
{{- $namespace := .Release.Namespace -}}
{{- $replicas := .Values.replicaCount | int -}}
{{- $headlessService := "nifi-headless" -}}
{{- $clusterDomain := "cluster.local" -}}
{{- $cn := printf "%s" $ip -}}
{{- /* Build SAN list */ -}}
{{- $sanList := list -}}
{{- $sanList = append $sanList "localhost" -}}
{{- $sanList = append $sanList "127.0.0.1" -}}
{{- $sanList = append $sanList $cn -}}

{{- /* Add per-pod headless entries */ -}}
{{- range $i, $e := until $replicas -}}
{{- $podDns := printf "nifi-%d.%s.%s.svc.%s" $i $headlessService $namespace $clusterDomain -}}
{{- $sanList = append $sanList $podDns -}}
{{- end -}}

{{- /* Add wildcard and service entries — replace ... with actual variables */ -}}
{{- $sanList = append $sanList (printf "*.%s.%s.svc.%s" $headlessService $namespace $clusterDomain) -}}
{{- $sanList = append $sanList (printf "*.%s.svc.%s" $namespace $clusterDomain) -}}
{{- $sanList = append $sanList (printf "%s.%s.svc.%s" $headlessService $namespace $clusterDomain) -}}
{{- $sanList = append $sanList (printf "nifi.%s.svc.%s" $namespace $clusterDomain) -}}


{{- $certFiles := .Files.Glob "certs/*.crt" -}}
{{- $keyFiles := .Files.Glob "certs/*.key" -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: apache-nifi-secret
  namespace: {{ $namespace | quote }}
  labels:
    app.kubernetes.io/name: {{ include "nifi.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: kubernetes.io/tls
data:
  {{- if and $certFiles $keyFiles }}
  {{- range $path, $content := $certFiles }}
  tls.crt: {{ $.Files.Get $path | b64enc | quote }}
  {{- end }}
  {{- range $path, $content := $keyFiles }}
  tls.key: {{ $.Files.Get $path | b64enc | quote }}
  {{- end }}
  {{- else }}
  {{- $ca := genCA $cn 3650 }}
  {{- $cert := genSignedCert $cn nil $sanList 3650 $ca }}
  tls.crt: {{ $cert.Cert | b64enc | quote }}
  tls.key: {{ $cert.Key | b64enc | quote }}
  ca.crt:  {{ $ca.Cert | b64enc | quote }}
  {{- end }}
{{- end }}
