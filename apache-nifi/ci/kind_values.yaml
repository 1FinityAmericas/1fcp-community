fullnameOverride: "nifi"
image:
  registry: artifactory.fnc.fujitsu.com
  repository: fcp/1.1/nifi
  tag: 2.9.0-debian13
  pullPolicy: IfNotPresent

securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  seccompProfile:
    type: RuntimeDefault

service:
  type: ClusterIP
  port: 8443

ingress:
  enabled: true
  className: ""
  ip: apache-nifi.127.0.0.1.nip.io
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "NIFI_SESSION"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "500m"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/session-cookie-expires: "172800"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "172800"
    nginx.ingress.kubernetes.io/affinity-mode: "persistent" 
  hosts:
    - host: apache-nifi.127.0.0.1.nip.io
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: apache-nifi-secret
      hosts:
      - apache-nifi.127.0.0.1.nip.io

persistence:
  enabled: true
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  storageClassName: "standard" # set to your storage class or leave empty

resources:
  requests:
    cpu: 2
    memory: 1Gi
  limits:
    cpu: 4
    memory: 2Gi
replicaCount: 3
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

rbac:
  create: true

# JVM sizing
jvm:
  xms: 1g
  xmx: 2g
  extra: ""

# Single-user authentication configuration
auth:
  mode: singleUser # only mode supported by this chart revision
  providerIdentifier: single-user-provider
  username: admin
  password: "0NifiAdmin@123" # Atleast 12 character long.
  # Optionally store a hashed password instead of plain text. If set, it takes precedence.
  hashedPassword: "" # e.g. bcrypt/argon2id hash if supported by your NiFi build

# NiFi properties
properties:
  web:
    protocol: https # http|https (this chart uses http; terminate TLS at ingress/LB)
    host: 0.0.0.0
    port: 8443
  s2s:
    enabled: false
    port: 10000

# Probes
probes:
  liveness:
    initialDelaySeconds: 120
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 8
  readiness:
    initialDelaySeconds: 90
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 12

# Extra environment vars
nifiWebProxyHost: "apache-nifi.127.0.0.1.nip.io"

# Local storage configuration using local PersistentVolumes
# Provides better security and follows Kubernetes best practices
localStorage:
  enabled: false
  storageClassName: "nifi-local-storage"
  pvPrefix: "nifi-local"
  # Define volumes - PVCs will bind to any worker node with matching label
  volumes:
  - type: custom-conf
    size: 100Mi
    path: /var/lib/docker/dynamic-local-path-mounts/nifi/conf
  - type: custom-lib
    size: 5Gi
    path: /var/lib/docker/dynamic-local-path-mounts/nifi/lib
  - type: custom-extensions
    size: 5Gi
    path: /var/lib/docker/dynamic-local-path-mounts/nifi/extensions
  - type: dpm-scripts
    size: 1Gi
    path: /var/lib/docker/dynamic-local-path-mounts/nifi/dpm-scripts

# Custom configuration files to mount to $NIFI_HOME/conf
customConf:
  enabled: false
  storageSize: "100Mi"

# Custom library files (JARs/NARs) to mount to $NIFI_HOME/lib
customLib:
  enabled: false
  storageSize: "5Gi"
# Custom extensions (NAR files) to mount to $NIFI_HOME/extensions
# NiFi 2.x autoloads NARs from this directory
customExtensions:
  enabled: false
  storageSize: "5Gi"
# DPM scripts to mount to $NIFI_HOME/dpm-scripts
dpmScripts:
  enabled: false
  storageSize: "1Gi"
