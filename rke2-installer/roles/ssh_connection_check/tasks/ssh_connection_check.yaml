- name: Set delete nodes fact
  set_fact:
   delete_nodes: "{{ groups['delete_nodes'] | list }}"
  register: delete_nodes_fact

- name: Set delete nodes in hostvars
  add_host:
    name: "{{ item }}"
    groups: delete_nodes_group
  loop: "{{ delete_nodes_fact.ansible_facts.delete_nodes }}"

- name: Wait for SSH connection
  become: no
  delegate_to: "{{ item }}"
  wait_for_connection:
    connect_timeout: 15
    timeout: 30
  register: ssh_connection
  ignore_errors: true
  loop: "{{ groups['delete_nodes_group'] }}"

- name: Identify unreachable worker/master nodes
  set_fact:
    unreachable_nodes: >-
      {{
        ssh_connection.results
        | selectattr('failed', 'defined')
        | selectattr('failed')
        | map(attribute='item')
        | list
      }}
  run_once: true

- name: Check if any SSH connection failed
  set_fact:
    ssh_failed: true
  when: "{{ unreachable_nodes | length > 0 }}"
  run_once: true
  register: ssh_failed_result

- name: Unreachable nodes are
  debug:
    msg: "unreachable nodes are: {{ unreachable_nodes }}"

- name: Delete the secret of the unreachable nodes
  shell: "kubectl delete secret {{ item }}.node-password.rke2 -n kube-system"
  when: unreachable_nodes | length > 0
  loop: "{{ unreachable_nodes }}"

- name: delete the unreachable nodes
  shell: "kubectl delete node {{ item }}"
  when: unreachable_nodes | length > 0
  loop: "{{ unreachable_nodes }}"

- name: Cleanup specific nodes from /etc/hosts
  become: yes
  shell: 'sed -i "/{{ item.0 }}.*#1fcp$/d" /etc/hosts'
  ignore_errors: yes
  loop: "{{ unreachable_nodes | product(groups ['kubenodes']) | list }}"
  delegate_to: "{{ item.1 }}"
  when: unreachable_nodes | length > 0 and item.1 not in unreachable_nodes
