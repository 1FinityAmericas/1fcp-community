---
# Tasks for disabling the scheduling on server nodes
#
- name: "running node taint on master nodes"
  shell: 'kubectl taint nodes {{ hostvars[item]["host"] }} node-role.kubernetes.io/control-plane=:NoSchedule --overwrite'
  with_items: "{{ groups['kubemasters'] }}"

- name: patch the master nodes
  shell: 'kubectl patch node {{ hostvars[item]["host"] }} -p "{\"spec\":{\"unschedulable\":true}}"'
  with_items: "{{ groups['kubemasters'] }}"

- name: cordon the master nodes
  shell: 'kubectl cordon {{ hostvars[item]["host"] }}'
  with_items: "{{ groups['kubemasters'] }}"

