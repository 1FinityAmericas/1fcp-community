# file: roles/app_config/tasks/main.yml

- name: Set ingress host ip
  set_fact:
    ingress_ip: "{{ hostvars[groups['primary_master_node_group'][0]].ip }}"
  when: (hostvars[groups['primary_master_node_group'][0]].ha_rke2|bool == false)  

- name: Set ingress host ip if secondary_master_nodes is not empty and he_rke2 set to true
  set_fact:
    ingress_ip: "{{ ha_rke2_vip_address }}"
  when: (hostvars[groups['primary_master_node_group'][0]].ha_rke2|bool == true) and 
        (groups['secondary_master_node_group'] | default([]) | length > 0)

- name: Load App Setup/configuration data
  include_vars:
    file: host_vars/app_config.yaml

- name: set ssh_failed flag
  set_fact:
    ssh_failed: false

- name: Updated docker_repo to local fnc if any of the fnc-registry deployment is set true
  set_fact:
    docker_repo: "{{ ext_doc_reg_dns }}"

- name: Register ansible user id
  shell: "id -u {{ ansible_user }}"
  register: user_id

- debug:
    msg: "user_id -> {{user_id }}"

- name: set ansible userid
  set_fact:
    ansible_user_id: "{{ user_id }}"

- name: Register ansible group id
  shell: "id -g {{ ansible_user }}"
  register: group_id

- debug:
    msg: "group_id -> {{group_id }}"

- name: set ansible groupid
  set_fact:
    ansible_group_id: "{{ group_id }}"
