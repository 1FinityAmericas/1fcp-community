- name: Stop firewalld service
  become: yes
  systemd:
    name: firewalld
    state: stopped
  ignore_errors: yes

- name: Stop iptables service
  become: yes
  systemd:
    name: iptables
    state: stopped
  ignore_errors: yes

- name: Disable iptables service
  become: yes
  systemd:
    name: iptables
    enabled: no
  ignore_errors: yes

- name: Disable firewalld service
  become: yes
  systemd:
    name: firewalld
    enabled: no
  ignore_errors: yes

- name: Enable service rke2-server
  become: yes
  systemd:
    name: rke2-server.service
    enabled: yes

- name : wait untill rke2-server service is enabled
  become: yes
  command: systemctl is-enabled rke2-server
  register: rke2_enabled
  until: rke2_enabled.stdout == "enabled"
  retries: 6
  delay: 10
  changed_when: false

- name: Ensure rke2-server.service is in a running state
  become: yes
  service:
    name: rke2-server.service 
    state: started
  register: myserviceDetails
  until: myserviceDetails.status.ActiveState is defined and myserviceDetails.status.ActiveState == "active"
  retries: 90
  delay: 10

- debug:
    msg: '{{ ansible_user }}'

- name: copy crictl.yaml to enable container tooling (1/3) - crictl
  become: yes
  copy:
    src: /var/lib/rancher/rke2/agent/etc/crictl.yaml
    dest: /etc/crictl.yaml
    owner: '{{ ansible_user }}'
    group: '{{ ansible_group }}'
    mode: u+x
    remote_src: yes

- name: Creates kube directory
  file:
    path: '{{ ansible_env.HOME }}/.kube'
    state: directory
    owner: '{{ ansible_user }}'
    group: '{{ ansible_group }}'
    mode: '0750'

- name: copy rke2.yaml to kubeconfig default path
  become: yes
  copy:
    src: /etc/rancher/rke2/rke2.yaml
    dest: '{{ ansible_env.HOME }}/.kube/config'
    owner: '{{ ansible_user }}'
    group: '{{ ansible_group }}'
    remote_src: yes
    mode: '0640'

- name: 'Update /etc/rancher/rke2/rke2.yaml file mode'
  become: yes
  shell: |
    chmod  644 /etc/rancher/rke2/rke2.yaml
  when: "{{ hostvars[inventory_hostname]['ip'] != hostvars[groups['primary_master_node_group'][0]].ip }}"


- name: Update bashrc with RKE2 paths
  blockinfile:
    dest: "~/.bashrc"
    block: |
      export PATH=$PATH:/var/lib/rancher/rke2/bin
      export KUBECONFIG=~/.kube/config
      export CRI_CONFIG_FILE=/etc/crictl.yaml
      alias  k=kubectl
    marker: '# {mark} Adding RKE2 binary paths'

- name: Update bashrc with RKE2 paths
  become: yes
  blockinfile:
    dest: "~/.bashrc"
    block: |
      export PATH=$PATH:/var/lib/rancher/rke2/bin
      export KUBECONFIG=~/.kube/config
      export CRI_CONFIG_FILE=/etc/crictl.yaml
      alias  k=kubectl
    marker: '# {mark} Adding RKE2 binary paths'

- name: source bashrc after update
  shell: "source ~/.bashrc && echo $KUBECONFIG"
  args:
     executable: /bin/bash

- name: source bashrc after update
  become: yes
  shell: "source ~/.bashrc && echo $KUBECONFIG"
  args:
     executable: /bin/bash

- name: Writing the node token to a variable
  become: yes
  shell: cat /var/lib/rancher/rke2/server/node-token
  register: token
  when: "{{ hostvars[inventory_hostname]['ip'] == hostvars[groups['primary_master_node_group'][0]].ip }}"

- name: copy token to a file under inventory path
  delegate_to: localhost
  copy:
    content: "{{ token.stdout }}"
    dest: "{{ ansible_env.HOME }}/token.txt"
  when: "{{ hostvars[inventory_hostname]['ip'] == hostvars[groups['primary_master_node_group'][0]].ip }}"

- name: Removing image tarballs
  shell: " rm -rf {{ ansible_env.HOME }}/rke2-artifacts*"
