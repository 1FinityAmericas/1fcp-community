---
# Creating secret for the nginx-ingres-controller using custom tls.crt and tls.key
- name: Create  tls.crt and tls.key for nginx ingresss controller using Openssl command
  shell: |
     openssl req -x509 -nodes -days 7300 -newkey rsa:2048 \
       -keyout tls.key -out tls.crt \
       -subj "/C=US/ST=CA/L=TX/O=SSOL/OU=FNC/CN=rke2.ingress.controller"
  args:
    chdir: "{{ playbook_dir }}/roles/launch_server_node/files"
  ignore_errors: yes

- name: Create secret with tls.crt and tls.key for nginx ingress controller
  shell: "kubectl create secret tls ingress-controller-tls --cert=tls.crt --key=tls.key -n kube-system"
  args:
    chdir: "{{ playbook_dir }}/roles/launch_server_node/files"
  ignore_errors: yes

- name: clearing nginx ingress controller tls crts under files folder
  shell: "rm -rf tls*"
  args:
    chdir: "{{ playbook_dir }}/roles/launch_server_node//files"
  ignore_errors: yes


