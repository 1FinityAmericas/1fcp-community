apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: rke2-ingress-nginx
  namespace: kube-system
spec:
  valuesContent: |-
    controller:
      config:
        keepalive_requests: "1000"
        http2_max_concurrent_streams: "128"
        http-snippet: |
          limit_conn_zone $binary_remote_addr zone=perip:10m;
          limit_req_zone $binary_remote_addr zone=perrps:10m rate=50r/s;
        server-snippet: |
          limit_conn perip 50;
          limit_req zone=perrps burst=100 nodelay;
          limit_conn_status 429;
          limit_req_status 429;
      hostNetwork: false
      hostPort:
        enabled: false
      publishService:
        enabled: true
      service:
        enabled: true
        externalIPs:
        type: ClusterIP
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
      extraArgs:
        default-ssl-certificate: "kube-system/ingress-controller-tls"
