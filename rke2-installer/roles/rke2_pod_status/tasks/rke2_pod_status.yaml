---
# Tasks for checking RKE2 pod statuses
#
- name: Retrieve Nodes count
  shell: "kubectl get nodes --no-headers |awk '{print $1}'"
  register: total_nodes

- name: Retrieve masters count
  shell: "kubectl get nodes -l node-role.kubernetes.io/control-plane --no-headers |awk '{print $1}'"
  register: master_nodes

- set_fact:
    nodes_count: "{{ total_nodes.stdout_lines |length}}"
    master_count: "{{ master_nodes.stdout_lines |length}}"

- name: Wait for calico-node pods to be in Running state
  shell: kubectl get pods -l app.kubernetes.io/name=calico-node -n calico-system  --no-headers |awk '{print $2, $3}'
  register: calico_pod_statuses
  until: >
    (calico_pod_statuses.stdout_lines | length == 0) or
    (
      calico_pod_statuses.stdout_lines
        | select('match', '^([0-9]+)/\\1 Running$')
        | list
        | length == (calico_pod_statuses.stdout_lines | length)
    )
  retries: 30
  delay: 10
  ignore_errors: yes

- name: Wait for etcd pods to be in Running state
  shell: kubectl get pods -n kube-system -l component=etcd  --no-headers |awk '{print $2, $3}'
