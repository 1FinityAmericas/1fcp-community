    )
  retries: 30
  delay: 10
  ignore_errors: yes

- name: "Summary pod tests-Failures"
  debug:
    msg: "Calico: {{ calico_pod_statuses.failed }} \n Etcd: {{  etcd_pod_statuses.failed  }} \n Api-Server: {{ api_pod_statuses.failed }} \n Scheduler: {{ sched_pod_statuses.failed }} \n Controller_Mgr:{{  cont_mgr_pod_statuses.failed  }} \n Kube-Proxy:{{ proxy_pod_statuses.failed  }} \n Kube-DNS:{{  dns_pod_statuses.failed  }} \n Ingress:{{  ing_pod_statuses.failed  }}"

- fail:
    msg: "At least one/more tasks/tests failed above. Hence aborting!"
  when: calico_pod_statuses.failed or etcd_pod_statuses.failed or api_pod_statuses.failed or sched_pod_statuses.failed or  cont_mgr_pod_statuses.failed or proxy_pod_statuses.failed or  dns_pod_statuses.failed or ing_pod_statuses.failed
