---
- hosts: primary_master_node_group
  gather_facts: false

  tasks:
    - name: Set fact on all nodes
      set_fact:
        reg_ca_cert_exists: false
        cert_fqdn: ""
      delegate_to: "{{ item }}"  
      delegate_facts: true
      loop: "{{ groups['kubenodes'] }}"

    - name: Check if registry CA certificate exists
      stat:
        path: /etc/pki/ca-trust/source/anchors/rootCA-loc-reg.crt
      register: cert_file

    - name: Validate certificate CN
      when: cert_file.stat.exists
      block:
        - name: Extract CN from certificate
          shell: >
            openssl x509 -in /etc/pki/ca-trust/source/anchors/rootCA-loc-reg.crt -noout -subject -nameopt RFC2253 | awk -F'CN=' '{print $2}' | awk -F',' '{print $1}'
          register: reg_fqdn
          changed_when: false

        - name: Set fact on all nodes required for skipping certs on all nodes
          set_fact:
            reg_ca_cert_exists: true
            cert_fqdn: "{{ reg_fqdn.stdout }}"
          delegate_to: "{{ item }}"  
          delegate_facts: true
          loop: "{{ groups['kubenodes'] }}"
          when: reg_fqdn.stdout == ext_doc_reg_dns

      
