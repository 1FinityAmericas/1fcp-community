# Molecule Default Scenario Configuration
# This scenario runs common preparation tasks before all other scenarios
---
platforms:
  - name: localhost

provisioner:
  name: ansible
  inventory:
    hosts:
      localhost:
        ansible_connection: local
        ansible_python_interpreter: /usr/bin/python3
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/roles"
    CLUSTER_CONFIG_FILE: "molecule/configs/cluster_config.yaml"
    APP_CONFIG_FILE: "molecule/configs/app_config.yaml"

scenario:
  name: default
  test_sequence:
    - syntax
    - converge
    - prepare
