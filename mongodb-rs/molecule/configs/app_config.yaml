mongodb_rs:
  app_name: mongodb-rs
  namespace: database
    

  ##-----------------psmdb-operator---------------------
  psmdb_operator:
    namespace: mongodb-operator
    replicaCount: 1
    image:
      repository: percona-server-mongodb-operator
      tag: 1.22.0
      enabled: true
    watchNamespaces: database
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1001
      runAsGroup: 1001
      fsGroup: 1001
      fsGroupChangePolicy: "OnRootMismatch"
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault

    env:
      resyncPeriod: 5s


  ##-----------------psmdb-cluster---------------------
  psmdb_cluster:
    crVersion: 1.22.0

    multiCluster:
      enabled: false

    image:
      repository: percona-server-mongodb
      tag: 7.0.31
      enabled: true

    tls:
      mode: preferTLS
      certValidityDuration: 2160h
      allowInvalidCertificates: true

    # Secrets Configuration (pre-created secrets)
    secrets:
      users: mongodb-rs-secrets
      ssl: mongodb-rs-ssl
      sslInternal: mongodb-rs-ssl-internal
    replsets:
      rs0:
        name: rs0
        size: 3
        podSecurityContext:
          fsGroup: 1001
        containerSecurityContext:
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
        resources:
          limits:
            cpu: "2000m"
            memory: "4Gi"
          requests:
            cpu: "1000m"
            memory: "4Gi"
        volumeSpec:
          pvc:
            storageClassName: rancher-dynamic-local-path
            resources:
              requests:
                storage: 3Gi
        hidden:
          enabled: false
          size: 2
          podSecurityContext:
            fsGroup: 1001
          containerSecurityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
          resources:
            limits:
              cpu: "2000m"
              memory: "4Gi"
            requests:
              cpu: "1000m"
              memory: "4Gi"
          volumeSpec:
            pvc:
              storageClassName: rancher-dynamic-local-path
              resources:
                requests:
                  storage: 3Gi
        nonvoting:
          enabled: false
          size: 3
          podSecurityContext:
            fsGroup: 1001
          containerSecurityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
          resources:
            limits:
              cpu: "2000m"
              memory: "4Gi"
            requests:
              cpu: "1000m"
              memory: "4Gi"
          volumeSpec:
            pvc:
              storageClassName: rancher-dynamic-local-path
              resources:
                requests:
                  storage: 3Gi
        arbiter:
          enabled: false
          size: 1
          resources:
            limits:
              cpu: "2000m"
              memory: "4Gi"
            requests:
              cpu: "1000m"
              memory: "4Gi"
    sharding:
      enabled: true
      balancer:
        enabled: false
      configrs:
        size: 3
        podSecurityContext:
          fsGroup: 1001
        containerSecurityContext:
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
        expose:
          enabled: false
          type: ClusterIP
        resources:
          limits:
            cpu: "2000m"
            memory: "4Gi"
          requests:
            cpu: "1000m"
            memory: "4Gi"
        volumeSpec:
          pvc:
            storageClassName: rancher-dynamic-local-path
            resources:
              requests:
                storage: 3Gi
      mongos:
        size: 3
        podSecurityContext:
          fsGroup: 1001
        containerSecurityContext:
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
        resources:
          limits:
            cpu: "1000m"
            memory: "2Gi"
          requests:
            cpu: "500m"
            memory: "2Gi"

  pmm:
    enabled: false
    image:
      repository: pmm-client
      tag: 3.6.0
      enabled: false
  backup:
    enabled: false
    image:
      repository: percona-backup-mongodb
      tag: 2.12.0
      enabled: false

  logcollector:
    enabled: false
    image:
      repository: fluentbit
      tag: 4.0.1-2
      enabled: false
    resources:
      requests:
        memory: 100M
        cpu: 200m


systemUsers:
  MONGODB_BACKUP_USER: backup
  MONGODB_BACKUP_PASSWORD: backup123456
  MONGODB_DATABASE_ADMIN_USER: databaseAdmin
  MONGODB_DATABASE_ADMIN_PASSWORD: databaseAdmin123456
  MONGODB_CLUSTER_ADMIN_USER: clusterAdmin
  MONGODB_CLUSTER_ADMIN_PASSWORD: clusterAdmin123456
  MONGODB_CLUSTER_MONITOR_USER: clusterMonitor
  MONGODB_CLUSTER_MONITOR_PASSWORD: clusterMonitor123456
  MONGODB_USER_ADMIN_USER: userAdmin
  MONGODB_USER_ADMIN_PASSWORD: userAdmin123456

external_registry:
  username: automation
  password: automation
