---
- hosts: localhost
  any_errors_fatal: true
  gather_facts: false

  tasks:
    - debug:
        msg:
          - Please execute the deployment script with one of the following options:
          -   -t deploy-mongodb-rs          : Deploy mongodb replicaset database
          -   -t cleanup-mongodb-rs         : Clean-up mongodb replicaset database
          -   -t push-images                :  Manage images (identify, load, and push to registry)
      tags: help
      run_once: true


- import_playbook: app_config.yaml
  tags: [never, deploy-mongodb-rs, cleanup-mongodb-rs]

- import_playbook: cleanup_mongodb_rs.yaml
  tags: [never, cleanup-mongodb-rs]

- import_playbook: deploy_mongodb_rs.yaml
  tags: [never, deploy-mongodb-rs]

