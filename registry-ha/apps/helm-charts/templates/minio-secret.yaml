{{- if .Values.credentials.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.credentials.name }}
  namespace: {{ include "registry.namespace" . }}
type: Opaque
stringData:
  accesskey: {{ .Values.credentials.accessKey }}
  secretkey: {{ .Values.credentials.secretKey }}
  http-secret: {{ .Values.credentials.httpSecret }}
{{- end }}
