---
# Play for deploying master based registry
- hosts: kubemasters
  tasks:
    - name: Detect home directory on a master node
      command: echo $HOME
      register: master_home

    - name: Set fact to prepare images 
      set_fact:
        ctr_cmd: "/var/lib/rancher/rke2/bin/ctr --address /run/k3s/containerd/containerd.sock -n k8s.io"      
        image_entries: >-
          {{
            docker_registry
            | dict2items
            | selectattr('value.image.repo', 'defined')
            | selectattr('value.image.enabled', 'equalto', true)
            | list
          }}
      run_once: true
      
    - name: Import images into containerd on master(s)
      become: yes
      shell: |
        for img in {{ master_home.stdout }}/*{registry,minio}*.tar; do
          [ -e "$img" ] || continue
          {{ ctr_cmd }} images import "$img"
        done
      args:
        executable: /bin/bash
      
    - name: Retag images on master(s)  to 1FCP version {{ release_tag }}
      become: yes
      command: >
        {{ ctr_cmd }} image tag
        {{ item.value.image.repo }}:{{ item.value.image.tag }}
        {{ registry }}/{{ item.key }}:{{ item.value.image.tag }}
      loop: "{{ image_entries }}"

    - name: Create the minio PV base path on  master(s)    
      become: yes
      ansible.builtin.file:
        path: "{{ docker_registry.minio.image.basePath }}"
        state: directory
        mode: "0755"
      
- hosts: primary_master_node_group
  environment:
    PATH: /var/lib/rancher/rke2/bin/:{{ ansible_env.PATH }}
    KUBECONFIG: /etc/rancher/rke2/rke2.yaml
  roles:
    - deploy_registry
