---
  #cleanup of local docker registry - HA mode/minio-based
- name: Scaling down all pods in the namespace.
  shell: |
    kubectl scale sts --all -n '{{ docker_registry.namespace }}' --replicas=0
  ignore_errors: true

- name: Remove local docker registry secrets .
  shell: |
    kubectl -n '{{ docker_registry.namespace }}' delete secret loc-reg-secret 
  ignore_errors: true

- name: Wait for pod to be deleted...
  command: "kubectl get pods -n '{{ docker_registry.namespace }}' --selector=app='{{ docker_registry.namespace }}' -o jsonpath='{.items[*].status.phase}'"
  register: pod_status
  retries: 10
  delay: 5
  until: pod_status.stdout == ""
  ignore_errors: true

- debug:
    var: pod_status

- name: Cleanup all PVCs
  shell: timeout 10 kubectl -n '{{ docker_registry.namespace }}' delete pvc --all --ignore-not-found=true || true
  ignore_errors: true

- name: Wait until all PVCs are cleared
  shell: kubectl get pvc -n {{ docker_registry.namespace }} -o name || true
  register: pvc_check
  until: pvc_check.stdout == ""
  retries: 5
  delay: 5
  changed_when: false
  ignore_errors: true

- name: Detect Terminating MinIO PVCs
  shell: kubectl get pvc -n {{ docker_registry.namespace }} | grep data-minio | grep Terminating || true
  register: pvc_terminating_check
  changed_when: false

- name: Patch & cleanup-terminating PVCs if any.
  block:
    - name: Patch PVC finalizers
      shell: |
        for pvc in $(kubectl get pvc -n {{ docker_registry.namespace }} |grep data-minio| awk '{print $1}');do
           kubectl patch pvc $pvc -p '{"metadata":{"finalizers":null}}' --type=merge
        done
    - name: Force delete remaining PVCs 
      shell: |
        kubectl get pvc -n {{ docker_registry.namespace }} --no-headers |grep data-minio| awk '{print $1}' | xargs -r kubectl delete pvc --force --grace-period=0
  when: pvc_terminating_check.stdout != ""

- name: Flush the minio disks explicitly for .minio.sys & the minio data for a clean minio quorum
  become: yes
  shell: |
    set -e
    p="{{ docker_registry.minio.image.basePath }}"
    test -d "$p"
    rm -rf {{ docker_registry.minio.image.basePath }}/.minio.sys
    find "$p" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
  delegate_to : "{{ item }}"
  with_items: "{{ groups['kubemasters'] }}"
  ignore_errors: yes
  changed_when: false

- name: Helm uninstall registry
  shell: helm delete ha-{{ docker_registry.namespace }} -n {{ docker_registry.namespace }}
  ignore_errors: true

- name: 'Remove rootCA-loc-reg.crt & update-ca-trust  on all nodes'
  become: yes
  shell: |
    if [ -d "/etc/pki/ca-trust/source/anchors/" ]
    then
        rm -f /etc/pki/ca-trust/source/anchors/rootCA-loc-reg.crt
        rm -f /etc/rancher/rke2/registries.yaml
        rm -f /etc/rancher/rke2/*loc-reg*
        update-ca-trust extract
        echo "RHEL/CentOS detected & updated trust!"
    fi
  delegate_to: "{{ item }}"
  with_items: "{{ groups ['kubenodes'] }}"
  ignore_errors: false
  register: results
  when: 
    -  rotate_cert | default(true) | bool


- name: Remove the mount point.
  become: yes
  file:
    path: "{{ docker_registry.reg_path }}/loc-reg"
    state: absent
  ignore_errors: true
  delegate_to: "{{ item }}"
  with_items: "{{ groups ['kubemasters'] }}"
  when:
    - rotate_cert | default(true) | bool


- name: cleanup of docker local registry entry from /etc/hosts
  become: yes
  shell: 'sed -i "/{{docker_repo}}\$/d" /etc/hosts'
  delegate_to: "{{ item }}"
  with_items: "{{ groups ['kubenodes'] }}"
  ignore_errors: yes
