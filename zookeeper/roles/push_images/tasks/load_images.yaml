---
# Loads images from tar files and tags them for the target registry.

- name: Resolve images to load
  set_fact:
    images_to_load: "{{ missing_images if push_all_images | default(false) == false else all_app_images }}"

- name: "Verify tar files exist (fail fast)"
  stat:
    path: "{{ playbook_dir }}/apps/images/{{ app_name }}/{{ item.repo }}-{{ item.tag }}.tar"
  register: tar_file_check
  loop: "{{ images_to_load }}"
  failed_when: not tar_file_check.stat.exists

- name: "Load images from tar files"
  become: yes
  command: podman load --input {{ item.repo }}-{{ item.tag }}.tar
  args:
    chdir: "{{ playbook_dir }}/apps/images/{{ app_name }}"
  loop: "{{ images_to_load }}"

- name: "Tag images for target registry"
  become: yes
  shell: |
    LOADED_IMG=$(podman images --format '{{ "{{" }}.Repository}}:{{ "{{" }}.Tag}}' \
      | grep -E '/{{ item.repo }}:{{ item.tag }}$' | head -n 1)
    if [ -z "$LOADED_IMG" ]; then
      echo "ERROR: Could not find loaded image {{ item.repo }}:{{ item.tag }}" >&2
      exit 1
    fi
    podman tag "$LOADED_IMG" {{ registry }}/{{ item.repo }}:{{ item.tag }}
  loop: "{{ images_to_load }}"