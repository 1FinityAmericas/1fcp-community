
- name: Get list of StorageClasses
  shell: kubectl get storageclass --no-headers
  register: sc_list
  changed_when: false

- name: Fail if no StorageClass exists in cluster
  fail:
    msg: "No StorageClass available in the cluster. Zookeeper deployment cannot continue."
  when: sc_list.stdout | trim | length == 0


- name: Check if app StorageClass exists
  shell: kubectl get storageclass {{ zookeeper.persistence.storageClass }}
  register: sc_check
  failed_when: false
  changed_when: false

- name: Get default StorageClass
  command: >
    kubectl get storageclass
    -o jsonpath='{.items[?(@.metadata.annotations.storageclass\.kubernetes\.io/is-default-class=="true")].metadata.name}'
  register: default_sc
  changed_when: false
  when: sc_check.rc != 0

- name: Set effective StorageClass
  set_fact:
    effective_storage_class: "{{ zookeeper.persistence.storageClass if sc_check.rc == 0 else default_sc.stdout }}"

- name: Fail if no usable StorageClass
  fail:
    msg: "Specified StorageClass '{{ zookeeper.persistence.storageClass }}' does not exist and no default StorageClass is available."
  when: sc_check.rc != 0 and (default_sc.stdout | trim | length == 0)

- name: create  namespace
  shell: kubectl create ns {{ zookeeper.namespace }}
  ignore_errors: true


- name: Helm Installing with value overrides
  shell: |
    helm upgrade --install zookeeper \
      --namespace {{ zookeeper.namespace }} \
      --create-namespace \
      --values {{ playbook_dir }}/apps/helm-charts/values.yaml \
      --set servers={{ zookeeper.cluster.replicaCount }} \
      --set minAvailable={{ zookeeper.cluster.quorum_size }} \
      --set image.registry={{ registry }} \
      --set image.repository={{ zookeeper.image.repository }} \
      --set image.tag={{ zookeeper.image.tag }} \
      --set image.pullPolicy={{ zookeeper.image.pullPolicy }} \
      --set podManagementPolicy={{ zookeeper.podManagementPolicy }} \
      --set updateStrategy={{ zookeeper.updateStrategy }} \
      --set securityContext.runAsUser={{ zookeeper.securityContext.runAsUser }} \
      --set securityContext.runAsGroup={{ zookeeper.securityContext.runAsGroup }} \
      --set securityGroup.fsGroup={{ zookeeper.securityContext.fsGroup }} \
      --set tickTime={{ zookeeper.tickTime }} \
      --set syncLimit={{ zookeeper.syncLimit }} \
      --set initLimit={{ zookeeper.initLimit }} \
      --set maxClientCnxns={{ zookeeper.maxClientCnxns }} \
      --set autoPurgeSnapRetainCount={{ zookeeper.autoPurgeSnapRetainCount }} \
      --set autoPurgePurgeInterval={{ zookeeper.autoPurgePurgeInterval }} \
      --set heapOptions="{{ zookeeper.heapOptions }}" \
      --set serverPort={{ zookeeper.serverPort }} \
      --set leaderElectionPort={{ zookeeper.leaderElectionPort }} \
      --set clientPort={{ zookeeper.clientPort }} \
      --set persistence.enabled={{ zookeeper.persistence.enabled }} \
      --set persistence.storageClass={{ effective_storage_class }} \
      --set persistence.dataDirSize={{ zookeeper.persistence.dataDirSize }} \
      --set persistence.dataLogDirSize={{ zookeeper.persistence.dataLogDirSize }} \
      --set resources.limits.cpu={{ zookeeper.resources.limits.cpu }} \
      --set resources.limits.memory={{ zookeeper.resources.limits.memory }} \
      --set resources.requests.cpu={{ zookeeper.resources.requests.cpu }} \
      --set resources.requests.memory={{ zookeeper.resources.requests.memory }} \
      --set jmx.port={{ zookeeper.jmx.port }} \
      --set prometheus.jmx.enabled={{ zookeeper.prometheus.image.enabled }} \
      --set prometheus.jmx.image.repository={{ zookeeper.prometheus.image.repository }} \
      --set prometheus.jmx.image.tag={{ zookeeper.prometheus.image.tag }} \
      --set prometheus.jmx.image.pullPolicy={{ zookeeper.prometheus.image.pullPolicy }} \
      --set prometheus.jmx.port={{ zookeeper.prometheus.port }} \
      {% if zookeeper.nodeSelector | default({}) %}
      {% for key, value in zookeeper.nodeSelector.items() %}
      --set nodeSelector.{{ key }}={{ value }} \
      {% endfor %}
      {% endif %}
      {{ playbook_dir }}/apps/helm-charts/
  register: helm_deploy_result

- name: Wait for zookeeper statefulset to be ready
  shell: kubectl rollout status statefulset/zookeeper -n {{ zookeeper.namespace }} --timeout=180s
  register: rollout_status

- name: Verify zookeeper pods are running
  shell: kubectl get pods -n {{ zookeeper.namespace }} -l app={{ app_name }} | grep Running | grep '{{ "2/2" if zookeeper.prometheus.image.enabled | bool else "1/1" }}'
  register: pod_status
  until: pod_status.stdout_lines | select('match', '.*Running.*') | list | length == zookeeper.cluster.replicaCount
  retries: 12
  delay: 10

- name: Get zookeeper service details
  shell: kubectl get svc -n {{ zookeeper.namespace }} {{ app_name }} -o wide
  register: service_details

- name: Display deployment summary
  debug:
    msg:
      - "Zookeeper Deployment Summary:"
      - "Namespace: {{ zookeeper.namespace }}"
      - "Helm Release: zookeeper"
      - "Service Details: {{ service_details.stdout }}"
      - "Pod Status: {{ pod_status.stdout }}"
