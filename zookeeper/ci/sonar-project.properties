# SonarQube Configuration for Kafka Ansible Repository

# Server configuration
sonar.host.url=https://vncsonar.fnc.fujitsu.com

# Project identification
sonar.projectKey=com.fujitsu.fcp:zookeeper
sonar.projectName=zookeeper
sonar.projectVersion=1.0.0-FCP-SNAPSHOT

# Source code location
sonar.sources=.

# Inclusions - Ansible specific files
sonar.inclusions=**/*.yml,**/*.yaml,**/*.py,**/*.j2,**/*.sh

# Exclusions - CI/CD, tests, Helm templates, and generated files
sonar.exclusions=ci/**/*,molecule/**/*,logs/**/*,.git/**/*,**/*.md,py_test/**/*

# Encoding
sonar.sourceEncoding=UTF-8

# Language hints for YAML/Ansible files
sonar.yaml.file.suffixes=.yml,.yaml
