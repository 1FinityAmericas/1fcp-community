---
platforms:
  - name: localhost

provisioner:
  name: ansible
  inventory:
    hosts:
      localhost:
        ansible_connection: local
        ansible_python_interpreter: /usr/bin/python3
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/roles"
    INVENTORY_FILE: "${INVENTORY_FILE:-molecule/configs/dep_hosts_kind}"
    CLUSTER_CONFIG_FILE: "${CLUSTER_CONFIG_FILE:-molecule/configs/cluster_config.yaml}"
    APP_CONFIG_FILE: "${APP_CONFIG_FILE:-molecule/configs/app_config.yaml}"

scenario:
  name: deploy-kafka
  test_sequence:
    - syntax
    - converge
