---
# Handles login, image collection from app config, and registry check.
# Sets missing_images fact which main.yaml uses to decide whether to load.

- name: Login to external registry
  shell: "podman login {{ ext_doc_reg_dns }} -u {{ external_registry.username }} -p {{ external_registry.password }}"
  changed_when: false
  ignore_errors: true

- name: "Collect enabled images from app config"
  set_fact:
    all_app_images: >-
      {%- set app_block = vars[app_name] -%}
      {%- set seen = [] -%}
      {%- set images = [] -%}
      {%- for key, val in app_block.items() -%}
        {%- if val is mapping and 'image' in val -%}
          {%- if val.image.get('enabled', true) -%}
            {%- set combo = val.image.repository ~ ':' ~ (val.image.tag | string) -%}
            {%- if combo not in seen -%}
              {%- set _ = seen.append(combo) -%}
              {%- set _ = images.append({'repo': val.image.repository, 'tag': (val.image.tag | string)}) -%}
            {%- endif -%}
          {%- endif -%}
        {%- endif -%}
      {%- endfor -%}
      {{ images }}

- name: "Check which images are missing from registry"
  become: yes
  command: podman manifest inspect {{ registry }}/{{ item.repo }}:{{ item.tag }}
  register: image_check
  failed_when: false
  changed_when: false
  loop: "{{ all_app_images }}"

- name: "Set missing_images fact"
  set_fact:
    missing_images: >-
      {{
        image_check.results
        | selectattr('rc', 'ne', 0)
        | map(attribute='item')
        | list
      }}

- name: "Report missing images"
  debug:
    var: missing_images
  when: missing_images | length > 0

- name: "All images already in registry — skipping load"
  debug:
    msg: "Nothing to load"
  when: missing_images | length == 0
