apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ template "kafka.fullname" . }}
  labels:
    app: {{ template "kafka.name" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    release: {{ .Release.Name }}
    chart: {{ template "kafka.chart" . }}
spec:
  selector:
    matchLabels:
      app: {{ template "kafka.name" . }}
      release: {{ .Release.Name }}
  serviceName: {{ template "kafka.fullname" . }}-headless
  podManagementPolicy: {{ .Values.podManagementPolicy }}
  replicas: {{ default 3 .Values.brokers }}
  updateStrategy:
    type: {{ .Values.updateStrategy }}
  template:
    metadata:
      labels:
        app: {{ template "kafka.name" . }}
        release: {{ .Release.Name }}
      {{- if or .Values.podAnnotations .Values.prometheus.enabled }}
      annotations:
      {{- range $key, $value := .Values.podAnnotations }}
        {{ $key }}: {{ $value | quote }}
      {{- end }}
      {{- if .Values.prometheus.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.prometheus.port | quote }}
      {{- end }}
      {{- end }}
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 1
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                    - {{ template "kafka.name" . }}
                  - key: app.kubernetes.io/instance
                    operator: In
                    values:
                    - {{ .Release.Name }}
              topologyKey: "kubernetes.io/hostname"
       #PSS-7311 To set 755 permission for zookeeper as we are running as non-root user
      initContainers:
      {{- if .Values.securityContextEnabled }}
      - name: chown
        image: "{{ .Values.global.imageRegistry }}/{{ .Values.image }}:{{ .Values.imageTag }}"
        imagePullPolicy: "{{ .Values.imagePullPolicy }}"
        command:
        - sh
        - "-c"
        - |
          KAFKA_USER={{ .Values.securityContext.runAsUser }}
          KAFKA_GROUP={{ .Values.securityContext.runAsGroup }}
          cp -r /etc/kafka/* /temp/configs/
          chown -R $KAFKA_USER:$KAFKA_GROUP /temp/configs /home/appuser
          chown -R $KAFKA_USER:$KAFKA_GROUP /temp/kafka /temp/data
          chmod -R 775  /temp/kafka /temp/data
        volumeMounts:
        - name: kafka-conf
          mountPath: /temp/configs
        - name: kafka-dir
          mountPath: /temp/kafka
        - name: kafka-data
          mountPath: /temp/data
        - name: home
          mountPath: /home/appuser
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
      {{- else }}
      - name: chown
        command:
        - sh
        - -c
        - |
          ls
          chmod -R 755 /var/lib/kafka/data && chown -R 1000:0 /var/lib/kafka/data && chmod -R 755 /etc/kafka && chown -R 1000:0 /etc/kafka && chmod -R 755 /etc/kafka/secrets && chown -R 1000:0 /etc/kafka/secrets
        image: "{{ .Values.global.imageRegistry }}/{{ .Values.initBusyBoxContainer.image }}:{{ .Values.initBusyBoxContainer.imageTag }}"
        imagePullPolicy: {{ .Values.initBusyBoxContainer.imagePullPolicy }}
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /opt/kafka/data-0
          name: datadir-0
        - mountPath: /var/lib/kafka/data
          name: data
        - mountPath: /etc/kafka
          name: kafka
        - mountPath: /etc/kafka/secrets
          name: secrets
      {{- end }}
      {{- if .Values.prometheus.enabled }}
      - name: inject-exporter-jar
        image: "{{ .Values.global.imageRegistry }}/{{ .Values.prometheus.image }}:{{ .Values.prometheus.imageTag }}"
        imagePullPolicy: "{{ .Values.prometheus.imagePullPolicy }}"
        env:
        - name: SHARED_VOLUME_PATH
          value: /jmx-exporter
        volumeMounts:
        - mountPath: /jmx-exporter
          name: jmx-exporter
      {{- end }}
      containers:
      - name: {{ template "kafka.name" . }}-broker
        image: "{{ .Values.global.imageRegistry }}/{{ .Values.image }}:{{ .Values.imageTag }}"
        imagePullPolicy: "{{ .Values.imagePullPolicy }}"
        {{- if .Values.securityContextEnabled }}
        securityContext: {{- toYaml .Values.securityContext | nindent 10 }}
        {{- end }}
        ports:
        - containerPort: 9092
          name: kafka
        {{- if .Values.jmx.port }}
        - containerPort: {{ .Values.jmx.port }}
          name: jmx
        {{- end }}
        {{- if .Values.prometheus.enabled }}
        - containerPort: {{ .Values.prometheus.port }}
          name: exporter
        {{- end }}
        {{- if .Values.nodeport.enabled }}
          {{- $brokers := .Values.brokers | int }}
          {{- $root := . }}
          {{- range $i, $e := until $brokers }}
        - containerPort: {{ add $root.Values.nodeport.firstListenerPort $i }}
          name: nodeport-{{ $i }}
          {{- end }}
        {{- end }}
        {{- if and .Values.resources (not .Values.global.singlevm) }}
        resources:
{{ toYaml .Values.resources | indent 10 }}
        {{- end }}
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: HOST_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: KAFKA_HEAP_OPTS
          value: {{ .Values.heapOptions }}
        - name: KAFKA_ZOOKEEPER_CONNECT
          value: {{ include "kafka.cp-zookeeper.service-name" . | quote }}
        - name: KAFKA_LOG_DIRS
          value: {{ include "kafka.log.dirs" . | quote }}
        {{- $flat := (include "flatten.map" .Values.configurationOverrides | fromYaml) }}
        {{- range $key, $value := $flat }}
        - name: {{ printf "KAFKA_%s" $key | replace "." "_" | upper | quote }}
          value: {{ $value | quote }}
        {{- end }}
        {{- range $key, $value := .Values.customEnv }}
        - name: {{ $key | quote }}
          value: {{ $value | quote }}
        {{- end }}
        {{- if .Values.jmx.port }}
        - name: KAFKA_JMX_PORT
          value: "{{ .Values.jmx.port }}"
        {{- end }}
        {{- if .Values.prometheus.enabled }}      
        - name: KAFKA_OPTS
          value: -javaagent:/jmx-exporter/jmx_prometheus_javaagent.jar={{ .Values.prometheus.port }}:/etc/exporter/jmx-kafka-prometheus.yml
        {{- end }}
        #Raghav:Fix for Kafka GC logs to stdout for fluentd to pick up:
        - name: KAFKA_GC_LOG_OPTS
          value: "-verbose:gc -XX:+PrintGCDetails"
          #value: "-verbose:gc -XX:+PrintGCDetails"
        # This is required because the Downward API does not yet support identification of
        # pod numbering in statefulsets. Thus, we are required to specify a command which
        # allows us to extract the pod ID for usage as the Kafka Broker ID.
        # See: https://github.com/kubernetes/kubernetes/issues/31218
        command:
        - sh
        - -exc
        - |
          export KAFKA_BROKER_ID=${HOSTNAME##*-} && \
          export KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://${POD_NAME}.{{ template "kafka.fullname" . }}-headless.${POD_NAMESPACE}.svc.cluster.local:9092{{ include "kafka.configuration.advertised.listeners" . }} && \
          unset KAFKA_PORT && exec /etc/confluent/docker/run
        volumeMounts:
        {{- if .Values.prometheus.enabled }}
        - name: jmx-exporter
          mountPath: /jmx-exporter
        - name: exporter-config
          mountPath: /etc/exporter
        {{- end }}
        {{- if .Values.securityContextEnabled }}
        - name: kafka-conf
          mountPath: /etc/kafka
        - name: kafka-dir
          mountPath: /var/lib/kafka
        - name: kafka-data
          mountPath: /var/lib/kafka/data
        - name: home
          mountPath: /home/appuser
        {{- else }}
        - name: data
          mountPath: /var/lib/kafka/data
        - mountPath: /etc/kafka
          name: kafka
        - mountPath: /etc/kafka/secrets
          name: secrets
        {{- end }}
        {{- if .Values.persistence.enabled }}
        {{- $disksPerBroker := .Values.persistence.disksPerBroker | int }}
        {{- range $k, $e := until $disksPerBroker }}
        - name: datadir-{{$k}}
          mountPath: /opt/kafka/data-{{$k}}
        #PSS-7311
        {{- else }}
        - name: datadir-0
          mountPath: /opt/kafka/data-0
        #PSS-7311
        {{- end }}
        {{- end }}
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml .Values.imagePullSecrets | indent 8 }}
      {{- end }}
      {{- if .Values.securityContextEnabled }}
      securityContext:
        fsGroup: {{ .Values.securityGroup.fsGroup }}
      {{- end }}
      volumes:
      {{- if .Values.securityContextEnabled }}
      - name: kafka-conf
        emptyDir: {}
      - name: kafka-dir
        emptyDir: {}
      - name: kafka-data
        emptyDir: {}
      - name: home
        emptyDir: {}
      {{- else }}
      - name: data
        emptyDir: {}
      - name: kafka
        emptyDir: {}
      - name: secrets
        emptyDir: {}
      {{- end }}
      {{- if not .Values.persistence.enabled }}
      - name: datadir-0
        emptyDir: {}
      {{- end }}
      #PSS-7311
      {{- if .Values.prometheus.enabled  }}
      - name: jmx-exporter
        emptyDir: {}      
      - name: exporter-config
        configMap:
          name: {{ template "kafka.fullname" . }}-exporter-configmap
      {{- end }}
      {{- if .Values.nodeSelector }}
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}
      {{- end }}
      {{- if .Values.tolerations }}
      tolerations:
{{ toYaml .Values.tolerations | indent 8 }}
      {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
  {{- $disksPerBroker := .Values.persistence.disksPerBroker | int }}
  {{- $root := . }}
  {{- range $k, $e := until $disksPerBroker }}
  - metadata:
      name: datadir-{{$k}}
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: "{{ $.Values.persistence.size }}"
      {{- if $.Values.persistence.storageClass }}
      {{- if (eq "-" $.Values.persistence.storageClass) }}
      storageClassName: ""
      {{- else }}
      storageClassName: "{{ $.Values.persistence.storageClass }}"
      {{- end }}
      {{- end }}
{{- end }}
{{- end }}
